<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Ribbon Master</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow: hidden; background-color: #f8d0e7; font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100vh; display: block; }
        #ui-layer { position: absolute; bottom: 20px; width: 100%; text-align: center; pointer-events: none; z-index: 100; }
        .guide-badge {
            display: inline-block; background: rgba(255, 255, 255, 0.9); color: #b30000;
            padding: 10px 30px; border-radius: 30px; font-size: 15px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        button {
            pointer-events: auto; cursor: pointer; background: #d42426; color: #FFF; border: none;
            padding: 12px 40px; border-radius: 50px; font-weight: bold; font-size: 16px;
            box-shadow: 0 5px 15px rgba(212, 36, 38, 0.3); margin-top: 10px;
        }
        #camera-preview {
            position: absolute; top: 20px; right: 20px; width: 120px; height: 90px;
            border: 3px solid rgba(255,255,255,0.8); box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: scaleX(-1); border-radius: 12px; opacity: 0.8;
        }
        #gold-title-container {
            position: absolute; top: 5%; width: 100%; text-align: center;
            pointer-events: none; z-index: 50; transition: opacity 0.5s ease;
        }
        .gold-text {
            font-family: 'Cinzel Decorative', cursive; font-size: 60px; color: #e06666;
            text-shadow: 2px 2px 0 #bf9b30, -1px -1px 0 #ffd700, 0 0 20px rgba(255, 215, 0, 0.6);
            letter-spacing: 3px; margin: 0;
        }
    </style>
</head>
<body>

    <div id="gold-title-container"><h1 class="gold-text">MERRY CHRISTMAS</h1></div>

    <div id="ui-layer">
        <div class="guide-badge">
             ✊ Cây Ruy Băng | 🖐 Tuyết Rơi | 🫶 Tim 💗
        </div>
        <br>
        <button id="btnStart" onclick="startSystem()">BẮT ĐẦU</button>
    </div>

    <div id="canvas-container"></div>
    <video class="input_video" style="display:none"></video>
    <canvas id="camera-preview"></canvas>

    <script>
        // ==========================================
        // 1. CẤU HÌNH
        // ==========================================
        const CONFIG = {
            maxImageScan: 50,
            targetPhotoCount: 36, 
            gridCols: 6,
            photoScale: 28,
            scrollSpeed: 4.0, 

            particleCount: 3500, // Cây
            treeHeight: 95, treeBaseRadius: 45,
            
            // Ruy băng
            ribbonSpiralCount: 800,  // Ruy băng xoắn trên cây
            ribbonSideCount: 2000,   // Ruy băng 2 bên (Đứng yên)
            
            heartCount: 3000, heartScale: 2.5, explosionForce: 3.5
        };

        let scene, camera, renderer;
        // Các đối tượng 3D
        let treeGroup = new THREE.Group(); // Nhóm chứa cây + xoắn (Xoay)
        let mainTreeParticles, spiralRibbonParticles;
        let staticRibbonParticles; // Ruy băng 2 bên (Không xoay)
        let starParticles, heartParticles;
        let photoGroup = new THREE.Group();
        let photoMeshes = [];

        let handOpenFactor = 0; 
        let isHeartMode = false;
        
        let heartPhase = 0; 
        let heartDrawProgress = 0;
        let explosionTimer = 0;
        let globalScrollY = 0;

        // --- TEXTURE ---
        function createCircleTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d'); ctx.beginPath(); ctx.arc(16, 16, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#FFFFFF'; ctx.fill();
            const grad = ctx.createRadialGradient(16,16,0,16,16,16);
            grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
            return new THREE.CanvasTexture(canvas);
        }

        function createEmojiHeartTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d'); ctx.font = '48px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('💗', 32, 36); return new THREE.CanvasTexture(canvas);
        }

        function createRoundedTexture(image) {
            const canvas = document.createElement('canvas');
            const w = image.width; const h = image.height;
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            const radius = Math.min(w, h) * 0.15;
            ctx.beginPath();
            ctx.moveTo(radius, 0); ctx.lineTo(w - radius, 0); ctx.quadraticCurveTo(w, 0, w, radius);
            ctx.lineTo(w, h - radius); ctx.quadraticCurveTo(w, h, w - radius, h);
            ctx.lineTo(radius, h); ctx.quadraticCurveTo(0, h, 0, h - radius);
            ctx.lineTo(0, radius); ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath(); ctx.clip();
            ctx.drawImage(image, 0, 0);
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 2. KHỞI TẠO 3D
        // ==========================================
        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0xf8d0e7, 0.001);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 170);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const roundTex = createCircleTexture();
            const heartTex = createEmojiHeartTexture();

            // 1. Tạo cây và ruy băng xoắn (Sẽ add vào treeGroup để xoay)
            createTreeAndSpiral(roundTex);
            scene.add(treeGroup);

            // 2. Tạo ruy băng 2 bên (Add trực tiếp vào scene để KHÔNG XOAY)
            createSideRibbons(roundTex);

            // 3. Các thành phần khác
            createStar(roundTex);
            createSpecialHeartSystem(heartTex); // Dùng icon 💗
            loadAndCreatePhotos();

            scene.add(photoGroup);
            animate();
        }

        // --- HỆ THỐNG 1: CÂY + XOẮN (NẰM TRONG GROUP XOAY) ---
        function createTreeAndSpiral(texture) {
            // A. Cây thông
            const treeGeo = new THREE.BufferGeometry();
            const treePos = []; const treeSnow = []; // Vị trí cây & tuyết
            for(let i=0; i<CONFIG.particleCount; i++) {
                const t = i/CONFIG.particleCount; const angle = t*Math.PI*40 + Math.random();
                const h = t*CONFIG.treeHeight; const r = (1-t)*CONFIG.treeBaseRadius;
                treePos.push(r*Math.cos(angle), h-CONFIG.treeHeight/2+5, r*Math.sin(angle));
                treeSnow.push((Math.random()-0.5)*400, (Math.random()-0.5)*300, (Math.random()-0.5)*200);
            }
            treeGeo.setAttribute('position', new THREE.Float32BufferAttribute(treePos,3));
            treeGeo.userData = { original: new THREE.Float32BufferAttribute(treePos,3), snow: new THREE.Float32BufferAttribute(treeSnow,3) };
            
            mainTreeParticles = new THREE.Points(treeGeo, new THREE.PointsMaterial({ 
                map: texture, color: 0xFFFFFF, size: 1.8, transparent: true, opacity: 1, blending: THREE.AdditiveBlending 
            }));
            treeGroup.add(mainTreeParticles);

            // B. Ruy băng xoắn (Spiral)
            const spiralGeo = new THREE.BufferGeometry();
            const spiralPos = []; const spiralSnow = [];
            for(let i=0; i<CONFIG.ribbonSpiralCount; i++) {
                const t = i/CONFIG.ribbonSpiralCount; const angle = t*Math.PI*15;
                const h = t*CONFIG.treeHeight - (CONFIG.treeHeight/2); const r = (1-t)*(CONFIG.treeBaseRadius+2);
                spiralPos.push(r*Math.cos(angle), h, r*Math.sin(angle));
                spiralSnow.push((Math.random()-0.5)*300, (Math.random()-0.5)*300, (Math.random()-0.5)*200);
            }
            spiralGeo.setAttribute('position', new THREE.Float32BufferAttribute(spiralPos,3));
            spiralGeo.userData = { original: new THREE.Float32BufferAttribute(spiralPos,3), snow: new THREE.Float32BufferAttribute(spiralSnow,3) };
            
            spiralRibbonParticles = new THREE.Points(spiralGeo, new THREE.PointsMaterial({ 
                map: texture, color: 0xFFD700, size: 2.0, transparent: true, opacity: 1, blending: THREE.AdditiveBlending 
            }));
            treeGroup.add(spiralRibbonParticles);
        }

        // --- HỆ THỐNG 2: RUY BĂNG 2 BÊN (ĐỨNG YÊN) ---
        function createSideRibbons(texture) {
            const geometry = new THREE.BufferGeometry();
            const currentPos = []; const ribbonPos = []; const snowPos = [];
            
            for(let i=0; i<CONFIG.ribbonSideCount; i++) {
                const t = i / CONFIG.ribbonSideCount;
                // Tạo 2 dải bên trái (-1) và phải (1)
                const side = (i % 2 === 0) ? 1 : -1;
                
                // Độ cao và vị trí cơ bản
                const h = (t * 130) - 65; 
                const xBase = side * 75; // Cách tâm 75 đơn vị
                
                // Tạo sóng lượn (Sin wave)
                const waveX = Math.sin(t * Math.PI * 8) * 8; 
                const waveZ = Math.cos(t * Math.PI * 5) * 15;
                
                // Tạo độ dày bản to (Random offset)
                const widthOffset = (Math.random() - 0.5) * 6;

                const x = xBase + waveX + widthOffset;
                const y = h;
                const z = waveZ;

                ribbonPos.push(x, y, z);
                
                // Vị trí khi nổ thành tuyết
                snowPos.push((Math.random()-0.5)*500, (Math.random()-0.5)*400, (Math.random()-0.5)*300);
                
                currentPos.push(x, y, z);
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(currentPos, 3));
            geometry.userData = { original: new THREE.Float32BufferAttribute(ribbonPos, 3), snow: new THREE.Float32BufferAttribute(snowPos, 3) };
            
            // Màu Vàng Gold
            const mat = new THREE.PointsMaterial({ map: texture, color: 0xFFD700, size: 1.8, transparent: true, opacity: 1, blending: THREE.AdditiveBlending });
            
            staticRibbonParticles = new THREE.Points(geometry, mat);
            // ADD TRỰC TIẾP VÀO SCENE ĐỂ KHÔNG BỊ XOAY
            scene.add(staticRibbonParticles);
        }

        // --- HỆ THỐNG TIM 💗 & CHỮ ---
        function getTextCoordinates(text) {
            const canvas = document.createElement('canvas'); canvas.width = 300; canvas.height = 100;
            const ctx = canvas.getContext('2d'); ctx.font = 'bold 50px Arial Black'; ctx.fillStyle = 'red'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 150, 50); const data = ctx.getImageData(0, 0, 300, 100).data; const points = [];
            for(let y=0; y<100; y+=2) { for(let x=0; x<300; x+=2) { if(data[(y*300+x)*4+3] > 128) points.push({ x: (x-150)*1.0, y: -(y-50)*1.0+5 }); } }
            return points;
        }

        function createSpecialHeartSystem(texture) {
            const geometry = new THREE.BufferGeometry();
            const currentPos = []; const heartPos = []; const textPos = []; const expDir = [];
            const textPoints = getTextCoordinates("LOVE U");

            for(let i=0; i<CONFIG.heartCount; i++) {
                const t = (i/CONFIG.heartCount)*Math.PI*2;
                let hx = 16*Math.pow(Math.sin(t),3); let hy = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
                hx += hx*(Math.random()-0.5)*0.1; hy += hy*(Math.random()-0.5)*0.1;
                heartPos.push(hx*CONFIG.heartScale, hy*CONFIG.heartScale+5, (Math.random()-0.5)*10);
                
                if(textPoints.length > 0) { const tp = textPoints[i%textPoints.length]; textPos.push(tp.x+(Math.random()-0.5), tp.y+(Math.random()-0.5), (Math.random()-0.5)*2); } else textPos.push(0,0,0);
                const phi = Math.acos(-1+(2*i)/CONFIG.heartCount); const theta = Math.sqrt(CONFIG.heartCount*Math.PI)*phi;
                expDir.push(Math.cos(theta)*Math.sin(phi), Math.sin(theta)*Math.sin(phi), Math.cos(phi));
                currentPos.push(0,-5000,0);
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(currentPos,3));
            geometry.userData = { heart: new THREE.Float32BufferAttribute(heartPos,3), text: new THREE.Float32BufferAttribute(textPos,3), exp: new THREE.Float32BufferAttribute(expDir,3) };
            
            const mat = new THREE.PointsMaterial({ map: texture, color: 0xFFFFFF, size: 4.0, transparent: true, opacity: 1, blending: THREE.NormalBlending, depthWrite: false });
            heartParticles = new THREE.Points(geometry, mat); heartParticles.frustumCulled = false; scene.add(heartParticles);
        }

        function createStar(texture) {
            const geometry = new THREE.BufferGeometry(); const positions = [];
            for(let i=0; i<300; i++) { const r = Math.random()*3; const theta = Math.random()*Math.PI*2; const phi = Math.random()*Math.PI; positions.push(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta) + CONFIG.treeHeight/2 + 12, r*Math.cos(phi)); }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ map: texture, color: 0xFFD700, size: 2.2, transparent: true, blending: THREE.AdditiveBlending });
            starParticles = new THREE.Points(geometry, mat); scene.add(starParticles);
        }

        // --- ẢNH ---
        function loadAndCreatePhotos() {
            const loader = new THREE.ImageLoader(); let loadedImages = []; let attempts = 0;
            function checkDone() { attempts++; if (attempts === CONFIG.maxImageScan) finalizeGrid(); }
            for(let i=1; i<=CONFIG.maxImageScan; i++) { loader.load(`image${i}.jpeg`, (img) => { loadedImages.push(img); checkDone(); }, undefined, () => { checkDone(); }); }
            function finalizeGrid() {
                if (loadedImages.length === 0) return;
                let finalPool = []; while(finalPool.length < CONFIG.targetPhotoCount) finalPool = finalPool.concat(loadedImages); finalPool = finalPool.slice(0, CONFIG.targetPhotoCount);
                for (let i = finalPool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [finalPool[i], finalPool[j]] = [finalPool[j], finalPool[i]]; }
                const spacingX = CONFIG.photoScale * 1.5; const spacingY = CONFIG.photoScale * 1.2; CONFIG.totalRowWidth = CONFIG.gridCols * spacingX; const startX = -(CONFIG.totalRowWidth - spacingX) / 2; const startY = ((CONFIG.gridCols - 1) * spacingY) / 2 + 10;
                finalPool.forEach((img, index) => {
                    const tex = createRoundedTexture(img); const aspect = img.width / img.height; const geo = new THREE.PlaneGeometry(1, 1);
                    const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true, opacity: 0 });
                    const mesh = new THREE.Mesh(geo, mat); mesh.scale.set(CONFIG.photoScale * aspect, CONFIG.photoScale, 1);
                    const col = index % CONFIG.gridCols; const row = Math.floor(index / CONFIG.gridCols);
                    mesh.userData = { colIndex: col, rowIndex: row, baseY: startY - row * spacingY, spacingX: spacingX, startX: startX };
                    photoMeshes.push(mesh); photoGroup.add(mesh);
                });
            }
        }

        // --- HELPER FUNCTION ĐỂ UPDATE HẠT ---
        function updateParticles(particleSystem, time, factor, isStatic) {
            const positions = particleSystem.geometry.attributes.position.array;
            const original = particleSystem.geometry.userData.original.array;
            const snow = particleSystem.geometry.userData.snow.array;
            
            // Tính toán nổ (Explosion factor)
            const exp = Math.pow(factor, 2.0);

            for(let i=0; i<positions.length/3; i++) {
                const ix = i*3;
                let tx = original[ix] + (snow[ix]-original[ix])*exp;
                let ty = original[ix+1] + (snow[ix+1]-original[ix+1])*exp;
                let tz = original[ix+2] + (snow[ix+2]-original[ix+2])*exp;

                // Nếu đang ở trạng thái tuyết (Mở tay > 50%)
                if (factor > 0.5) {
                    snow[ix+1] -= (0.4 + Math.random()*0.4); // Rơi xuống
                    // Loop tuyết rơi
                    if (snow[ix+1] < -150) { 
                        snow[ix+1] = 150; 
                        snow[ix] = (Math.random()-0.5)*400; // Reset ngang
                    }
                    // Gió thổi
                    tx += Math.sin(time + i) * 0.2; 
                } else if (isStatic) {
                    // Nếu là ruy băng đứng yên và đang đóng tay -> Rung rinh nhẹ
                    tx += Math.sin(time * 2 + i) * 0.1;
                }

                // Di chuyển hạt
                positions[ix] += (tx - positions[ix]) * 0.15;
                positions[ix+1] += (ty - positions[ix+1]) * 0.15;
                positions[ix+2] += (tz - positions[ix+2]) * 0.15;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
        }

        // ==========================================
        // 3. ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const goldTitle = document.getElementById('gold-title-container');

            if (isHeartMode) {
                // CHẾ ĐỘ TIM
                treeGroup.visible = false; staticRibbonParticles.visible = false;
                starParticles.visible = false; photoGroup.visible = false; goldTitle.style.opacity = 0;
                heartParticles.visible = true; heartParticles.position.set(0,0,0);

                const positions = heartParticles.geometry.attributes.position.array; const hAttr = heartParticles.geometry.userData.heart.array; const tAttr = heartParticles.geometry.userData.text.array; const eAttr = heartParticles.geometry.userData.exp.array;
                if (heartPhase === 0) { if (heartDrawProgress < CONFIG.heartCount) { heartDrawProgress += 30; heartParticles.geometry.setDrawRange(0, heartDrawProgress); } for(let i=0; i<heartDrawProgress; i++) { const ix=i*3; positions[ix]+=(hAttr[ix]-positions[ix])*0.3; positions[ix+1]+=(hAttr[ix+1]-positions[ix+1])*0.3; positions[ix+2]+=(hAttr[ix+2]-positions[ix+2])*0.3; } if(heartDrawProgress >= CONFIG.heartCount) { explosionTimer+=0.016; if(explosionTimer>1.0) {heartPhase=1; explosionTimer=0;} } } else if (heartPhase === 1) { for(let i=0; i<CONFIG.heartCount; i++) { const ix=i*3; positions[ix]+=eAttr[ix]*CONFIG.explosionForce; positions[ix+1]+=eAttr[ix+1]*CONFIG.explosionForce; positions[ix+2]+=eAttr[ix+2]*CONFIG.explosionForce; } explosionTimer+=0.016; if(explosionTimer>1.0) heartPhase=2; } else if (heartPhase === 2) { for(let i=0; i<CONFIG.heartCount; i++) { const ix=i*3; positions[ix]+=(tAttr[ix]-positions[ix])*0.05; positions[ix+1]+=(tAttr[ix+1]-positions[ix+1])*0.05; positions[ix+2]+=(tAttr[ix+2]-positions[ix+2])*0.05; } }
                heartParticles.geometry.attributes.position.needsUpdate = true; heartParticles.rotation.y = (heartPhase === 0) ? Math.sin(time)*0.2 : 0;

            } else {
                // CHẾ ĐỘ CÂY/ẢNH
                heartParticles.position.set(0, -5000, 0); heartPhase=0; heartDrawProgress=0; explosionTimer=0; heartParticles.geometry.setDrawRange(0,0);
                
                // Hiện mọi thứ
                treeGroup.visible = true; 
                staticRibbonParticles.visible = true;
                starParticles.visible = true;

                const textOpacity = 1 - Math.min(handOpenFactor * 3, 1);
                goldTitle.style.opacity = textOpacity; starParticles.material.opacity = textOpacity;

                // 1. UPDATE CÁC HỆ THỐNG HẠT
                // Cây & Xoắn (Trong group xoay)
                updateParticles(mainTreeParticles, time, handOpenFactor, false);
                updateParticles(spiralRibbonParticles, time, handOpenFactor, false);
                
                // Ruy băng 2 bên (Đứng yên - không xoay)
                updateParticles(staticRibbonParticles, time, handOpenFactor, true);

                // Xoay Cây (Nhưng không xoay ruy băng 2 bên vì nó nằm ngoài group)
                if(handOpenFactor < 0.2) treeGroup.rotation.y += 0.005;

                // 2. ĐỔI MÀU RUY BĂNG KHI NỔ (Gold -> White)
                const hue = 0.14; // Gold hue
                const sat = 1.0 * (1 - handOpenFactor); // Mất màu
                const light = 0.5 + 0.5 * handOpenFactor; // Sáng lên thành trắng
                spiralRibbonParticles.material.color.setHSL(hue, sat, light);
                staticRibbonParticles.material.color.setHSL(hue, sat, light);

                // 3. ẢNH
                let photoOp = Math.max(0, (handOpenFactor-0.3)*1.5);
                if (photoOp > 0) {
                    photoGroup.visible = true;
                    if (handOpenFactor > 0.8) globalScrollY += CONFIG.scrollSpeed * 0.1;
                    const zZoom = THREE.MathUtils.lerp(-100, 0, handOpenFactor);
                    photoMeshes.forEach(mesh => {
                        mesh.material.opacity = THREE.MathUtils.lerp(mesh.material.opacity, photoOp, 0.1);
                        let rawX = (mesh.userData.colIndex * mesh.userData.spacingX) + globalScrollY;
                        let wrappedX = rawX % CONFIG.totalRowWidth;
                        let finalX = wrappedX + mesh.userData.startX;
                        mesh.position.set(finalX, mesh.userData.baseY, zZoom);
                    });
                } else photoGroup.visible = false;
            }
            renderer.render(scene, camera);
        }

        function startSystem() {
            document.getElementById('btnStart').style.display = 'none';
            const audio = new Audio('audio.mp3'); audio.loop = true; audio.play().catch(()=>{});
            init3D();
            const video = document.getElementsByClassName('input_video')[0];
            const canvas = document.getElementById('camera-preview');
            const ctx = canvas.getContext('2d');
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            hands.onResults(results => {
                ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
                isHeartMode = false;
                if (results.multiHandLandmarks.length === 2) {
                    const h1 = results.multiHandLandmarks[0]; const h2 = results.multiHandLandmarks[1];
                    if (Math.hypot(h1[4].x - h2[4].x, h1[4].y - h2[4].y) < 0.25 && Math.hypot(h1[8].x - h2[8].x, h1[8].y - h2[8].y) < 0.25) isHeartMode = true;
                }
                if (!isHeartMode && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0]; const tips = [8,12,16,20]; const wrist = lm[0]; let totalDist = 0; tips.forEach(i => totalDist += Math.hypot(lm[i].x-wrist.x, lm[i].y-wrist.y));
                    const avgDist = totalDist / 4; let targetFactor = (avgDist - 0.1) / 0.25; targetFactor = Math.max(0, Math.min(1, targetFactor));
                    handOpenFactor += (targetFactor - handOpenFactor) * 0.1;
                } else if (!isHeartMode) { handOpenFactor += (0 - handOpenFactor) * 0.05; }
            });
            let lastTime = 0;
            const cameraUtils = new Camera(video, { onFrame: async () => { const now = Date.now(); if (now - lastTime < 50) return; lastTime = now; await hands.send({image: video}); }, width: 320, height: 240 });
            cameraUtils.start();
        }
        window.addEventListener('resize', () => { if(camera){ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }});
    </script>
</body>
